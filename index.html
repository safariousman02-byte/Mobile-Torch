<!DOCTYPE html>

<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    </head>

    <body>

        <div class="container">

            <div class="top">

                <span class="pp"><span class="material-symbols-outlined" >clear_day</span></span>

                <div class="text1">

                </div>

                <span class="ps">
                    <span class="material-symbols-outlined">battery_charging_full</span>

                </span>

            </div>

            <div class="info">

                    <div class="til">Routine</div>
                    <div class="val" id="val1">44</div>
                </div>
                <div class="plof">
                    <div class="til">Surface Temperature</div>
                    <div class="val">55</div>
                </div>
                <div class="plof">
                    <div class="til">Luminance</div>
                    <div class="val">88</div>
                </div>
            </div>            
            
        </div>



        <script src="script.js"></script>
