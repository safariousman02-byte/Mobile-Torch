<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumos Torch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🔆</div>
                <div class="logo-text">
                    <h1>Lumos Torch</h1>
                    <p>● Ultra Warm Beam Active</p>
                </div>
            </div>
            <div class="battery">
                🔋 88%
            </div>
        </header>

        <!-- STATS -->
        <div class="stats">
            <div class="stat-card">
                <span>Runtime</span>
                <strong>4h15m</strong>
            </div>
            <div class="stat-card">
                <span>Surface Temp</span>
                <strong>31°C</strong>
            </div>
            <div class="stat-card active">
                <span>Luminance</span>
                <strong>1,200 lm</strong>
            </div>
        </div>

        <!-- MAIN POWER BUTTON -->
        <div class="power-section">
            <div class="power-ring">
                <div class="power-circle">
                    <div class="power-icon">⏻</div>
                    <p>POWER ON</p>
                </div>
            </div>

            <div class="status-pill">
                ● ON • 100% Beam Active
            </div>
            <p class="hint">Tap switch to power off</p>
        </div>

        <!-- ILLUMINATION POWER -->
        <div class="illumination">
            <div class="illum-header">
                <span>⚙️ Illumination Power</span>
                <span class="percent">100%</span>
            </div>

            <div class="slider-track">
                <div class="slider-fill"></div>
                <div class="slider-knob"></div>
            </div>

            <div class="presets">
                <button>25%</button>
                <button>50%</button>
                <button>75%</button>
                <button class="active">100%</button>
            </div>
        </div>

        <!-- MODES -->
        <div class="modes">
            <div class="mode-card">
                <div class="mode-icon red">✳️</div>
                <div>
                    <strong>SOS Beacon</strong>
                    <p>Morse strobe</p>
                </div>
            </div>
            <div class="mode-card">
                <div class="mode-icon orange">💡</div>
                <div>
                    <strong>Lantern 360°</strong>
                    <p>Soft diffuse</p>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <span>🔦</span>
                <p>Torch</p>
            </div>
            <div class="nav-item">
                <span>💡</span>
                <p>Modes</p>
            </div>
            <div class="nav-item">
                <span>⏱️</span>
                <p>Timer</p>
            </div>
            <div class="nav-item">
                <span>⚙️</span>
                <p>Settings</p>
            </div>
        </nav>

    </div>
</body>
</html>
